name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Git Tag matches pubspec.yaml version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' flutter/pubspec.yaml | awk '{print $2}' | tr -d '\r')
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          echo "Pubspec Version: $PUBSPEC_VERSION"
          echo "Git Tag Version: $TAG_VERSION"

          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! pubspec.yaml ($PUBSPEC_VERSION) does not match Git tag ($TAG_VERSION)."
            exit 1
          fi

  publish:
    needs: validate-version
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: flutter
